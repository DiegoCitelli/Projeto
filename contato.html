<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Contato</title>

  <link rel="stylesheet" href="contato.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

  <a href="#" class="top-button">↑</a>

  <header>
    <div class="menu">
      <a href="index.html">
        <img class="img-menu" src="img/Logo Ford.png" alt="Logo Ford">
      </a>

      <nav class="nav-menu">
        <a href="index.html">Início</a>
        <a href="veiculos.html">Veículos</a>
        <a href="nossa-historia.html">Nossa História</a>
        <a href="contato.html">Contato</a>
      </nav>
    </div>
  </header>

  <div class="fundo">

    <main class="main-content">

      <section class="secao-titulo-pagina">
        <h1 class="titulo-principal">Contato</h1>
        <div class="linha-decorativa"></div>
      </section>

      <form id="formContato" class="contact-form">

        <div class="form-group">
          <input id="nome" type="text" name="nome" placeholder="Nome" required>
        </div>

        <div class="form-group">
          <input id="sobrenome" type="text" name="sobrenome" placeholder="Sobrenome" required>
        </div>

        <div class="form-group email-group">
          <input id="email" type="email" name="email" placeholder="Email" required>
        </div>

        <div class="form-group assunto-group">
          <input id="assunto" type="text" name="assunto" placeholder="Assunto">
        </div>

        <div class="form-group message-group">
          <textarea id="mensagem" name="mensagem" placeholder="Sua mensagem" required></textarea>
        </div>

        <button type="submit" class="botao">
          Enviar Mensagem
        </button>

      </form>

    </main>

  </div>

  <footer>
    <div class="footer-conteudo">

      <div class="footer-logo">
        <img src="img/Logo Ford.png" alt="Logo Ford">
      </div>

      <p>Ford 2026 © Todos os direitos reservados.</p>

      <div class="social-icons">
        <a href="https://www.instagram.com/fordbrasil" target="_blank">
          <i class="bi bi-instagram"></i>
        </a>

        <a href="https://www.youtube.com/fordbrasil" target="_blank">
          <i class="bi bi-youtube"></i>
        </a>

        <a href="https://api.whatsapp.com/send/?phone=551142003303&text&type=phone_number&app_absent=0" target="_blank">
          <i class="bi bi-whatsapp"></i>
        </a>

        <a href="https://br.linkedin.com/company/ford-brasil" target="_blank">
          <i class="bi bi-linkedin"></i>
        </a>
      </div>

    </div>
  </footer>

  <div id="toast" class="toast-custom">
    <i class="bi bi-check-circle-fill"></i>
    Mensagem enviada com sucesso!
  </div>

  <script src="script.js"></script>

</body>

</html>
