  <main class="main-content">
    <!-- <h1 class="title">Formulário de Contato</h1> -->

    <section class="secao-titulo-pagina">
      <h1 class="titulo-principal">Contato</h1>
      <div class="linha-decorativa">
    </section>

    <form class="contact-form">
      <div class="form-group">
        <input type="text" name="nome" placeholder="Nome" required>
      </div>

      <div class="form-group">
        <input type="text" name="sobrenome" placeholder="Sobrenome" required>
      </div>

      <div class="form-group email-group">
        <input type="email" name="email" placeholder="Email" required>
      </div>

      <div class="form-group assunto-group">
        <input type="text" name="assunto" placeholder="Assunto">
      </div>

      <div class="form-group message-group">
        <textarea name="mensagem" placeholder="Sua mensagem" required></textarea>
      </div>

      <button type="submit" class="botao">Enviar Mensagem</button>
    </form>
  </main>
  </div>
